name: Deploy to Alibaba Cloud

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    if: vars.AUTO_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Test and package
        run: ./mvnw --batch-mode clean verify
      - name: Configure SSH
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts
      - name: Upload and restart
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          scp -i ~/.ssh/deploy_key target/demo-0.0.1-SNAPSHOT.jar "$SERVER_USER@$SERVER_HOST:/tmp/industrial-defect-demo.jar"
          ssh -i ~/.ssh/deploy_key "$SERVER_USER@$SERVER_HOST" \
            "sudo install -o admin -g admin -m 644 /tmp/industrial-defect-demo.jar /opt/industrial-defect-demo/app.jar && sudo systemctl restart industrial-defect-demo.service"
          ssh -i ~/.ssh/deploy_key "$SERVER_USER@$SERVER_HOST" \
            "for i in 1 2 3 4 5 6; do sleep 3; curl -fsS http://127.0.0.1:8080/demo/api/health && exit 0; done; exit 1"

